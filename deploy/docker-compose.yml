# Production Compose file for the UGOS Docker app (Docker > Project > Create) and plain `docker compose`.
# Image only, no build. Replace the digest with the one printed by the container workflow's job summary,
# after `gh attestation verify --owner jflopezo91 oci://ghcr.io/jflopezo91/meal-prep@sha256:<digest>`.
# Rollback = put the previous digest back and redeploy.
#
# One-time on the NAS (SSH): mkdir -p /volume1/docker/meal-prep/data && chown 10001:10001 /volume1/docker/meal-prep/data
services:
  meal-prep:
    image: ghcr.io/jflopezo91/meal-prep@sha256:REPLACE_WITH_DIGEST  # placeholder: never use a mutable tag
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      MEALPLANNER_TIMEZONE: America/Bogota
      # No login exists yet (phase 6c): the published port is the only access control, so the port is
      # bound to loopback below. Do not widen it before household login ships.
      MEALPLANNER_TRUST_NETWORK_PEERS: "1"
      MEALPLANNER_PUBLISH_REPO: git@github.com:jflopezo91/meal-plan.git
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /volume1/docker/meal-prep/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Starting limits; set from solver timings measured on the N100 (phase 6d).
    # mem_limit: 1g
    # cpus: 2.0
    # pids_limit: 256
    #
    # Phase 6b: the publish deploy key, mounted as a file (never an environment variable).
    secrets:
      - deploy_key

secrets:
  deploy_key:
    # Generated on the NAS: ssh-keygen -t ed25519 -N "" -f /volume1/docker/meal-prep/secrets/deploy_key
    # then: chown 10001:10001 deploy_key && chmod 600 deploy_key && chmod 700 ../secrets
    # (the file keeps its host owner and mode, and ssh rejects a key the container user does not own).
    file: /volume1/docker/meal-prep/secrets/deploy_key
