  /api/v1/coverage:
    get:
      tags: [Shopping trips]
      operationId: getCoverage
      summary: Read week coverage for a date range
      description: |-
        For every plan whose Monday-through-Sunday week overlaps the inclusive range (same range rules as listPlans), reports coverage derived from shopping trips: not_covered (no trip), on_list (open trip) or covered (done trip), with the trip_id and changed_since_shopping (true when the plan's current revision is newer than the revision the done trip covered). Coverage is never stored on the plan, so plan summaries are unchanged. When the API is not SQLite-backed every plan is not_covered.
      parameters:
        - $ref: '#/components/parameters/CoverageFrom'
        - $ref: '#/components/parameters/CoverageTo'
      responses:
        '200':
          description: Per-plan coverage, ordered by week_start.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageList'
              examples:
                coverage:
                  summary: Covered, on a list, and not covered
                  externalValue: examples/coverage.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/publishing:
    get:
      tags: [Publishing]
      operationId: getPublishing
      summary: Publishing status
      description: |-
        Whether publishing is configured (enabled), the public site URL, the most recently started job and the most recent job confirmed live. A latest job in status pushed is refreshed from GitHub first (cached for at least 10 seconds), so it may come back live or failed. Job records are private and never part of the public bundle.
      responses:
        '200':
          description: Publishing status.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishingStatus'
              examples:
                enabled:
                  summary: Configured, a push awaiting its Pages deployment
                  externalValue: examples/publishing.json
                disabled:
                  summary: MEALPLANNER_PUBLISH_REPO is not set
                  externalValue: examples/publishing-disabled.json
  /api/v1/publishing/preview:
    get:
      tags: [Publishing]
      operationId: previewPublication
      summary: Preview what publishing the selected months would include
      description: |-
        Lists every full week overlapping the selected months with its current revision and the revision in the last live job (published_revision, null when never published), plus every shopping trip whose weeks are all included. unchanged is true when publishing now would be a no-op because the public repository already holds identical content built from the same application revision. Nothing is written or pushed.
      parameters:
        - name: months
          in: query
          required: true
          description: Comma-separated YYYY-MM months; 1 to 12, unique.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])(,\d{4}-(0[1-9]|1[0-2])){0,11}$'
          example: 2026-10,2026-11
      responses:
        '200':
          description: The preview.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishingPreview'
              examples:
                preview:
                  summary: Two months, one week republished
                  externalValue: examples/publishing-preview.json
        '422':
          $ref: '#/components/responses/PublishInvalidMonths'
        '502':
          $ref: '#/components/responses/PublishFailed'
        '503':
          $ref: '#/components/responses/PublishingDisabled'
  /api/v1/publishing/jobs:
    post:
      tags: [Publishing]
      operationId: createPublicationJob
      summary: Publish the selected months
      description: |-
        Runs synchronously: exports the selected months, validates the bundle, commits it to the public repository and pushes it. The response is the finished job: pushed (the Pages deployment is still to be confirmed through the job resource) or unchanged (the repository already had identical content; nothing was committed). One job runs at a time (409 publish_in_progress). A failure is recorded as a failed job, answered with 502 publish_failed, and leaves the previously pushed version untouched. Needs a loopback client (403 forbidden) and publishing configured (503 publishing_disabled, also when the application revision is unknown).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            example:
              months: ['2026-10', '2026-11']
      responses:
        '201':
          description: The finished job.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishingJob'
              examples:
                pushed:
                  summary: Pushed, deployment pending
                  externalValue: examples/publishing-job.json
                unchanged:
                  summary: Identical to what is published
                  externalValue: examples/publishing-job-unchanged.json
        '400':
          $ref: '#/components/responses/PublishInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '409':
          $ref: '#/components/responses/PublishInProgress'
        '422':
          $ref: '#/components/responses/PublishInvalidMonths'
        '502':
          $ref: '#/components/responses/PublishFailed'
        '503':
          $ref: '#/components/responses/PublishingDisabled'
  /api/v1/publishing/jobs/{job_id}:
    get:
      tags: [Publishing]
      operationId: getPublicationJob
      summary: Read one publication job
      description: |-
        A job in status pushed is refreshed from the GitHub Actions run for its commit (cached for at least 10 seconds): live (with deployed_at) once the Pages deployment succeeded, failed when it did not. If GitHub cannot be reached the job stays pushed. live is never reported without that confirmation.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishingJob'
              examples:
                pushed:
                  summary: Deployment pending
                  externalValue: examples/publishing-job.json
                live:
                  summary: Deployment confirmed
                  externalValue: examples/publishing-job-live.json
        '404':
          $ref: '#/components/responses/PublishJobNotFound'
        '503':
          $ref: '#/components/responses/PublishingDisabled'
  /api/v1/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: Read what this client may do
      description: |-
        can_edit_plans and can_edit_shopping_trips are true only when the API is backed by
        SQLite and the request comes from a loopback address. Clients must use it, never their own guess, to
        decide whether to offer editing. The server re-checks authorization on every
        mutation regardless of this value.
      responses:
        '200':
          description: Capabilities for this client.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                editable:
                  summary: Editing available
                  externalValue: examples/capabilities.json
components:
  parameters:
    Month:
      name: month
      in: path
      required: true
      description: Calendar month as YYYY-MM.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-10'
    PlanId:
      name: plan_id
      in: path
      required: true
      description: Opaque plan identifier; 1–128 ASCII letters, digits, underscores, or hyphens, beginning with a letter or digit. Invalid identifiers return 400.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: plan_2026_10_19
    ProposalId:
      name: proposal_id
      in: path
      required: true
      description: Opaque proposal identifier returned when the proposal was created.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: prop_9b1f0c2e4d5a4f7c8a3e6d1b2c0f4a55
    TripId:
      name: trip_id
      in: path
      required: true
      description: Opaque shopping trip identifier; 1–128 ASCII letters, digits, underscores, or hyphens, beginning with a letter or digit.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: trip_5c1e9a7f3b2d4e6f8a0b1c2d3e4f5a6b
    JobId:
      name: job_id
      in: path
      required: true
      description: Publication job identifier returned when the job was created.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: job_20261021T150000Z_3f9a1c20
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      description: The trip version the client is looking at (DELETE has no body). A mismatch returns 409 stale_version.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 2
    CoverageFrom:
      name: from
      in: query
      required: true
      description: Inclusive start date in ISO 8601 YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    CoverageTo:
      name: to
      in: query
      required: true
      description: Inclusive end date in ISO 8601 YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: '2026-10-31'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        Client-generated retry id, 1 to 128 printable ASCII characters. Reuse the same key
        to retry the same request safely (the original result is replayed with
        replayed: true). Reusing it for a different request returns 422 retry_id_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7e]+$'
      example: 3f0c8e52-6c1a-4d0e-9a53-0d6a2d9d7c11
  responses:
    WriteInvalidRequest:
      description: Malformed JSON body, unknown or invalid field, bad identifier, missing Idempotency-Key, or a week_start that is not a Monday (invalid_week).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
            missingKey:
              summary: Idempotency-Key header missing
              externalValue: examples/error-missing-idempotency-key.json
            invalidWeek:
              summary: week_start is not a Monday
              externalValue: examples/error-invalid-week.json
    WriteForbidden:
      description: Mutations and history need a loopback client (forbidden) and a SQLite-backed API (read_only, JSON snapshot mode).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Non-loopback client attempted a change
              externalValue: examples/error-forbidden.json
            readOnly:
              summary: API is serving the JSON snapshot
              externalValue: examples/error-read-only.json
    TripInvalidRequest:
      description: Malformed JSON body, unknown or invalid field, bad identifier, or a missing or invalid expected_version.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
    TripNotFound:
      description: No shopping trip exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownTrip:
              summary: Unknown trip identifier
              externalValue: examples/error-trip-not-found.json
    TripOrPlanNotFound:
      description: Unknown trip (trip_not_found), unknown plan (plan_not_found), or a plan that is not on the trip (week_not_on_trip).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownTrip:
              summary: Unknown trip identifier
              externalValue: examples/error-trip-not-found.json
            unknownPlan:
              summary: Unknown plan identifier
              externalValue: examples/error-plan-not-found.json
            weekNotOnTrip:
              summary: Plan is not on this trip
              externalValue: examples/error-week-not-on-trip.json
    TripConflict:
      description: stale_version (expected_version is behind), week_already_on_trip, trip_done (needs an open trip), trip_not_done (needs a done trip), or last_week. Nothing was changed.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            staleVersion:
              summary: expected_version is behind the current version
              externalValue: examples/error-stale-version.json
            weekAlreadyOnTrip:
              summary: Plan is already on a trip
              externalValue: examples/error-week-already-on-trip.json
            tripDone:
              summary: Trip is done; reopen it first
              externalValue: examples/error-trip-done.json
            tripNotDone:
              summary: Trip is not done
              externalValue: examples/error-trip-not-done.json
            lastWeek:
              summary: Cannot remove the only week
              externalValue: examples/error-last-week.json
    InvalidRequest:
      description: Missing or malformed input, or an invalid date range.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRange:
              summary: Range end precedes range start
              externalValue: examples/error-invalid-range.json
            invalidDate:
              summary: Date is not a calendar date in YYYY-MM-DD format
              externalValue: examples/error-invalid-date.json
            invalidRevision:
              summary: Revision must be a positive integer
              externalValue: examples/error-invalid-revision.json
    PlanNotFound:
      description: No plan exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownPlan:
              summary: Unknown plan identifier
              externalValue: examples/error-plan-not-found.json
    SourceFailure:
      description: The source is unavailable or contains invalid plan data.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              summary: Temporary source failure
              externalValue: examples/error-source-unavailable.json
            invalidSource:
              summary: Source data failed validation
              externalValue: examples/error-source-invalid.json
    PublishInvalidRequest:
      description: Malformed JSON body, unknown field, or missing months.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
    PublishInvalidMonths:
      description: months is empty, malformed, contains a duplicate, or lists more than 12 months.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidMonths:
              summary: Invalid month selection
              externalValue: examples/error-invalid-months.json
    PublishInProgress:
      description: Another publication job is running (a running job older than 10 minutes counts as crashed).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            inProgress:
              summary: A job is running
              externalValue: examples/error-publish-in-progress.json
    PublishFailed:
      description: Export, validation, commit or push failed. The job is recorded as failed; the previous public version is untouched. The message never contains paths or credentials.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            failed:
              summary: Push rejected
              externalValue: examples/error-publish-failed.json
    PublishingDisabled:
      description: Publishing is not configured (no MEALPLANNER_PUBLISH_REPO, no SQLite database) or the application revision is unknown.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            disabled:
              summary: Not configured
              externalValue: examples/error-publishing-disabled.json
    PublishJobNotFound:
      description: No publication job exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Unknown job
              externalValue: examples/error-not-found.json
  schemas:
    PlanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
    PlanSummary:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: |-
            Opaque content token for the normalized plan and shopping payload, including
            the week anchor. The example token is SHA-256 over canonical UTF-8 JSON for
            {"plan": <plan object without snapshot_id>, "shopping_list": <shopping object
            without snapshot_id>}, with object keys sorted recursively, no insignificant
            whitespace, and ensure_ascii=false. Implementations may use another opaque
            token algorithm, but unchanged normalized content must retain its token.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed, slots, derived]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: Opaque content token shared with the matching shopping list.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
        slots:
          type: array
          description: Ordered by date, then lunch before dinner; no fixed maximum is imposed.
          items:
            $ref: '#/components/schemas/MealAssignment'
        derived:
          $ref: '#/components/schemas/PlanDerived'
    PlanDerived:
      type: object
      additionalProperties: false
      required: [protein_counts, carb_counts]
      properties:
        protein_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          required: [chicken, beef, pork, fish, egg]
          properties:
            chicken: {type: integer, minimum: 0}
            beef: {type: integer, minimum: 0}
            pork: {type: integer, minimum: 0}
            fish: {type: integer, minimum: 0}
            egg: {type: integer, minimum: 0}
        carb_counts:
          type: object
          description: Counts for carb ingredient IDs present in this plan.
          additionalProperties:
            type: integer
            minimum: 0
    MealAssignment:
      type: object
      additionalProperties: false
      required: [assignment_id, date, day, meal, recipe_id, recipe_name, variant_id, protein, protein_quantity, carb, carb_quantity, ingredients, extended_from_lunch, linked_assignment_id]
      properties:
        assignment_id:
          type: string
          minLength: 1
          description: Stable identity for this date and meal within its plan.
        date:
          type: string
          format: date
          description: Actual meal date within the plan's Monday-Sunday week.
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
          description: Weekday corresponding to date.
        meal:
          type: string
          enum: [lunch, dinner]
        recipe_id:
          type: string
          minLength: 1
        recipe_name:
          type: string
        variant_id:
          type: string
          minLength: 1
        protein:
          type: string
          enum: [chicken, beef, pork, fish, egg]
        protein_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Raw quantity of the protein ingredient, not nutritional protein weight.
        carb:
          type: [string, 'null']
          description: Carb ingredient ID, or null when the assignment has no carb.
        carb_quantity:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
          description: Null when carb is null; otherwise its raw ingredient amount.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/PlanIngredient'
        extended_from_lunch:
          type: boolean
          description: True for a dinner that reuses the same base recipe as lunch.
        linked_assignment_id:
          type: [string, 'null']
          description: Reciprocal assignment ID for a linked same-day lunch/dinner pair, otherwise null.
    Quantity:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
    PlanIngredient:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, role]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        role:
          type: string
          enum: [protein, protein_extra, veg, fat, condiment, garnish, herb, spice, dairy, other, carb]
          description: Recipe ingredient role; carb is added for the selected variant's carbohydrate ingredient.
    ShoppingList:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, week_start, week_end, sections]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        sections:
          type: object
          description: Map from shopping section name to its ingredient lines.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ShoppingLine'
    ShoppingLine:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, section, notes]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        notes:
          type: [string, 'null']
    Capabilities:
      type: object
      additionalProperties: false
      required: [can_edit_plans, can_edit_shopping_trips, can_publish]
      properties:
        can_edit_plans:
          type: boolean
          description: True only for a loopback client of a SQLite-backed API.
        can_edit_shopping_trips:
          type: boolean
          description: True under the same conditions; gates creating, changing, finishing, and deleting shopping trips.
        can_publish:
          type: boolean
          description: True only for a loopback client when publishing is configured (MEALPLANNER_PUBLISH_REPO); gates the publish view.
    PublishRequest:
      type: object
      additionalProperties: false
      required: [months]
      properties:
        months:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    PublishingJob:
      type: object
      additionalProperties: false
      required: [job_id, months, status, publication_id, commit_sha, run_url, error, started_at, finished_at, deployed_at]
      description: A private record of one publish attempt.
      properties:
        job_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        months:
          type: array
          items:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        status:
          type: string
          enum: [running, pushed, live, failed, unchanged]
          description: running (in progress, or crashed until it is 10 minutes old), pushed (committed and pushed, deployment not yet confirmed), live (Pages deployment confirmed), failed (export, push or deployment failed), unchanged (identical content already published; no commit).
        publication_id:
          type: [string, 'null']
          description: The publication this job pushed, or for unchanged the one already published.
        commit_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
        run_url:
          type: [string, 'null']
          format: uri
          description: The GitHub Actions run that builds and deploys the pushed commit, once known.
        error:
          type: [string, 'null']
          description: Safe failure message (no paths or credentials).
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
          description: When the export and push finished (not when the deployment did).
        deployed_at:
          type: [string, 'null']
          format: date-time
          description: When the Pages deployment was confirmed; set only with status live.
    PublishingStatus:
      type: object
      additionalProperties: false
      required: [enabled, site_url, latest_job, last_live_job]
      properties:
        enabled:
          type: boolean
        site_url:
          type: string
        latest_job:
          anyOf:
            - $ref: '#/components/schemas/PublishingJob'
            - type: 'null'
        last_live_job:
          anyOf:
            - $ref: '#/components/schemas/PublishingJob'
            - type: 'null'
    PublishingPreview:
      type: object
      additionalProperties: false
      required: [months, weeks, trips, unchanged]
      properties:
        months:
          type: array
          items:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        weeks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [plan_id, week_start, week_end, revision, published_revision]
            properties:
              plan_id:
                type: string
              week_start:
                type: string
                format: date
              week_end:
                type: string
                format: date
              revision:
                type: integer
                minimum: 1
              published_revision:
                type: [integer, 'null']
                minimum: 1
                description: Revision of this week in the last live job; null when it was never published.
        trips:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [trip_id, name, status]
            properties:
              trip_id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [open, done]
        unchanged:
          type: boolean
          description: True when publishing now would be a no-op.
    FillMonthRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Empty object; the month comes from the path.
    WeekFillOutcome:
      type: object
      additionalProperties: false
      required: [week_start, week_end, status]
      properties:
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        status:
          type: string
          enum: [created, exists, skipped_past, failed]
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Present for created and exists.
        revision:
          type: integer
          minimum: 1
          description: Present for created (always 1) and exists (the current revision, never changed by a fill).
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          description: Present only for failed.
          properties:
            code:
              type: string
              enum: [generation_failed, rule_violation, week_not_editable, invalid_week]
            message:
              type: string
    MonthFillResult:
      type: object
      additionalProperties: false
      required: [month, weeks]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        weeks:
          type: array
          minItems: 4
          maxItems: 6
          description: Every Monday-Sunday week overlapping the month, in order.
          items:
            $ref: '#/components/schemas/WeekFillOutcome'
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [week_start]
      properties:
        week_start:
          type: string
          format: date
          description: Monday of the household week to create.
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to the week's deterministic seed, int(YYYYMMDD of its Monday) mod 2**31.
    ProposeRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to a fresh random seed different from the current plan seed.
    ExpectedRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
    SlotChange:
      type: object
      additionalProperties: false
      required: [assignment_id, date, meal, kind, before, after]
      properties:
        assignment_id:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        meal:
          type: string
          enum: [lunch, dinner]
        kind:
          type: string
          enum: [changed, added, removed]
        before:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
        after:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
    Proposal:
      type: object
      additionalProperties: false
      required: [proposal_id, plan_id, base_revision, base_snapshot_id, seed, created_at, expires_at, identical, replaced_swaps, changes, plan, shopping_list]
      properties:
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        base_revision:
          type: integer
          minimum: 1
          description: The current revision this proposal was computed against.
        base_snapshot_id:
          type: string
          minLength: 1
        seed:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        identical:
          type: boolean
          description: True when accepting would change nothing; plan is then the current content.
        replaced_swaps:
          type: integer
          minimum: 0
          description: Slots of the current revision changed by manual swaps since the last generated revision (create, regenerate, import) that accepting would replace. Show a warning when above 0.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SlotChange'
        plan:
          $ref: '#/components/schemas/Plan'
        shopping_list:
          $ref: '#/components/schemas/ShoppingList'
    SwapRequest:
      type: object
      additionalProperties: false
      required: [slot_id, variant_id, scope, expected_revision]
      properties:
        slot_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The assignment_id of the slot to change.
        variant_id:
          type: string
          minLength: 1
          maxLength: 128
          description: A variant_id from GET /api/v1/catalog/variants.
        scope:
          type: string
          enum: [pair, single]
          description: pair swaps a linked lunch/dinner together (an unlinked slot is swapped alone); single swaps only this slot and unlinks the pair.
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
    SwapVariant:
      type: object
      additionalProperties: false
      required: [recipe_id, variant_id, name, protein, carb]
      properties:
        recipe_id:
          type: string
          minLength: 1
        variant_id:
          type: string
          minLength: 1
        name:
          type: string
          description: Display name plans show for this variant (the recipe name).
        protein:
          type: string
          enum: [chicken, beef, pork, fish, egg]
        carb:
          type: [string, 'null']
          description: Carb ingredient ID, or null when the variant has no carb.
    SwapVariantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Sorted by name, then variant_id.
          items:
            $ref: '#/components/schemas/SwapVariant'
    GroceryDeltaRow:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, unit, section, before, after, difference]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        before:
          type: number
          minimum: 0
          description: Weekly quantity to buy before the swap (0 when absent).
        after:
          type: number
          minimum: 0
          description: Weekly quantity to buy after the swap (0 when absent).
        difference:
          type: number
          description: after - before, never 0.
    RuleWarning:
      type: object
      additionalProperties: false
      required: [rule, message]
      properties:
        rule:
          type: string
          minLength: 1
          description: Stable weekly rule code, for example consecutive_same_protein.
        message:
          type: string
    ExtraNeededRow:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, unit, quantity]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        unit:
          type: string
          enum: [g, ml, units]
        quantity:
          type: number
          exclusiveMinimum: 0
    SwapTripImpact:
      type: object
      additionalProperties: false
      required: [trip_id, name, status, extra_needed]
      properties:
        trip_id:
          type: string
          minLength: 1
        name:
          type: string
        status:
          type: string
          enum: [open, done]
        extra_needed:
          type: array
          description: Always empty for an open trip (it follows the new revision). For a done trip, what the swapped week needs beyond what the trip covered.
          items:
            $ref: '#/components/schemas/ExtraNeededRow'
    SwapPreview:
      type: object
      additionalProperties: false
      required: [plan_id, base_revision, changes, grocery_delta, rule_warnings, trip]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        base_revision:
          type: integer
          minimum: 1
          description: The current revision the preview was computed against.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SlotChange'
        grocery_delta:
          type: array
          items:
            $ref: '#/components/schemas/GroceryDeltaRow'
        rule_warnings:
          type: array
          description: Every weekly-rule violation the swapped plan has (advisory).
          items:
            $ref: '#/components/schemas/RuleWarning'
        trip:
          oneOf:
            - $ref: '#/components/schemas/SwapTripImpact'
            - type: 'null'
          description: The shopping trip holding this week, or null.
    SwapResult:
      type: object
      additionalProperties: false
      required: [plan, rule_warnings]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        rule_warnings:
          type: array
          description: Every weekly-rule violation the resulting plan has (advisory).
          items:
            $ref: '#/components/schemas/RuleWarning'
    MutationResult:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, changed, replayed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
          description: The current revision after the call (unchanged when changed is false).
        snapshot_id:
          type: string
          minLength: 1
        changed:
          type: boolean
        replayed:
          type: boolean
          description: True when this is a replay of an earlier request with the same Idempotency-Key.
    RevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, snapshot_id, source, created_at]
      properties:
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        source:
          type: string
          enum: [import, create, regenerate, swap, undo]
        created_at:
          type: string
          format: date-time
    RevisionList:
      type: object
      additionalProperties: false
      required: [plan_id, items]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        items:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/RevisionSummary'
    CoverageState:
      type: string
      enum: [not_covered, on_list, covered]
      description: not_covered (no trip), on_list (open trip), covered (done trip).
    ShoppingTripWeek:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, revision, snapshot_id, current_revision, coverage, changed_since_shopping]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        revision:
          type: integer
          minimum: 1
          description: The plan revision this trip's items use for the week; the current revision on an open trip, the covered revision on a done trip.
        snapshot_id:
          type: string
          minLength: 1
          description: snapshot_id of that revision.
        current_revision:
          type: integer
          minimum: 1
          description: The plan's current revision when the trip was read.
        coverage:
          type: string
          enum: [on_list, covered]
          description: on_list for an open trip, covered for a done trip.
        changed_since_shopping:
          type: boolean
          description: True on a done trip when current_revision is newer than revision.
    ShoppingTripItem:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, section, plan_ids]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
          description: Sum over the contributing weeks for this ingredient and unit.
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        plan_ids:
          type: array
          description: Plans whose grocery rows contribute to this item, in week order.
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
    ShoppingTrip:
      type: object
      additionalProperties: false
      required: [trip_id, name, status, version, created_at, updated_at, completed_at, weeks, items]
      description: A shopping trip (called a shopping list in the UI) with its weeks and derived items. Reused by the static publication.
      properties:
        trip_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [open, done]
        version:
          type: integer
          minimum: 1
          description: Starts at 1 and increases by 1 on every mutation; the optimistic-concurrency token.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
          description: When the trip was marked done; null while open.
        weeks:
          type: array
          minItems: 1
          description: Covered weeks, ordered by week_start.
          items:
            $ref: '#/components/schemas/ShoppingTripWeek'
        items:
          type: array
          description: Derived sum of the weeks' saved grocery rows per ingredient and unit, grouped by section.
          items:
            $ref: '#/components/schemas/ShoppingTripItem'
    ShoppingTripList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingTrip'
    CreateShoppingTripRequest:
      type: object
      additionalProperties: false
      required: [plan_ids]
      properties:
        plan_ids:
          type: array
          minItems: 1
          maxItems: 60
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        name:
          type: [string, 'null']
          maxLength: 80
          description: Optional short label; defaults to the covered date range.
    AddTripWeekRequest:
      type: object
      additionalProperties: false
      required: [plan_id, expected_version]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
    WeekCoverage:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, coverage, trip_id, changed_since_shopping]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        coverage:
          $ref: '#/components/schemas/CoverageState'
        trip_id:
          anyOf:
            - {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
            - type: 'null'
        changed_since_shopping:
          type: boolean
    CoverageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeekCoverage'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_week, forbidden, read_only, plan_not_found, snapshot_changed, source_unavailable, source_invalid, stale_revision, proposal_not_found, proposal_expired, input_basis_changed, retry_id_reused, nothing_to_undo, linked_pair_split, week_not_editable, duplicate_week, generation_failed, rule_violation, generation_busy, slot_not_found, variant_not_found, slot_not_editable, trip_not_found, stale_version, week_already_on_trip, trip_done, trip_not_done, week_not_on_trip, last_week, invalid_months, publish_in_progress, publishing_disabled, publish_failed, not_found]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
