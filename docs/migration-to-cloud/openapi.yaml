openapi: 3.1.0
info:
  title: Meal Prep API
  version: 0.1.0
  description: |-
    Versioned API for dated weekly meal plans and their current shopping snapshots.
    Reads are always available. Plan changes (create, propose, accept, discard, undo)
    and revision history need a SQLite-backed server and a loopback client; the server
    rejects them otherwise (403 forbidden or read_only). Static publication stays
    read-only. This development API is intended to bind to loopback. It has no
    authentication scheme and is not ready for remote deployment. Household-only
    access protection is required before any remote exposure.
servers:
  - url: http://127.0.0.1:5000
    description: Local development server bound to loopback
security: []
tags:
  - name: Plans
    description: Dated weekly plans, their grocery snapshots, and revision history.
  - name: Proposals
    description: Preview, accept, discard, and undo plan changes.
  - name: Capabilities
    description: What the calling client may do.
paths:
  /api/v1/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Find plans overlapping a date range
      description: |-
        Returns plans whose Monday-through-Sunday calendar week inclusively overlaps
        the requested inclusive date range. The range must satisfy from <= to and
        contain at most 366 calendar days, counting both endpoints. Results are
        ordered by week_start ascending. An empty result is returned as items: [].
        Dates are calendar dates in the household timezone; current examples use
        America/Bogota. Reads never generate or modify a plan.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: Inclusive end date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-31'
      responses:
        '200':
          description: Matching current plan summaries, possibly an empty list.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
              examples:
                matchingPlan:
                  summary: One current plan
                  externalValue: examples/plans.json
                noMatchingPlans:
                  summary: No plans overlap this range
                  externalValue: examples/plans-empty.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/SourceFailure'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create revision 1 of the plan for a week
      description: |-
        Solves and stores a new plan for a current or future Monday-through-Sunday week
        (one plan per week); seed defaults to 42. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden. Solver runs are bounded: at most
        MEALPLANNER_MAX_CONCURRENT_GENERATIONS run at once (others get 503 generation_busy,
        never queued) and each solve has a time limit (422 generation_failed).
      requestBody:
        required: true
        description: Week to create and optional solver seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: The new plan at revision 1.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                created:
                  summary: Newly created plan
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '409':
          description: The week already has a plan, or has already ended.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateWeek:
                  summary: Week already has a plan
                  externalValue: examples/error-duplicate-week.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit; nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json
  /api/v1/plans/{plan_id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Read a current weekly plan
      description: |-
        Returns the current snapshot for this plan. plan_id is opaque to clients.
        Slots are ordered by date, then lunch before dinner. The week starts Monday
        and week_end is the inclusive Sunday. Dates must fall within that week and
        agree with their day value. Assignment IDs are stable for a slot within a
        plan and unique within its snapshot. Where a lunch and dinner assignment
        are linked, linked_assignment_id is reciprocal and both use the same base
        recipe. extended_from_lunch identifies the dinner that extends its lunch.
        The initial source covers weekday cooking only, but the schema imposes no
        permanent maximum slot count. Protein quantities are raw protein ingredient
        amounts in their stated units, not nutritional protein weight. The seed is
        provenance and is not a plan identity or a promise of reproducibility.
        snapshot_id is an opaque content token, separate from the persistent integer
        revision. It remains stable for an unchanged normalized plan and shopping
        payload, and changes when either payload or its week anchor changes.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                currentWeek:
                  summary: Current plan for week beginning October 19, 2026
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/shopping-list:
    get:
      tags: [Plans]
      operationId: getShoppingList
      summary: Read the shopping list for the current plan snapshot
      description: |-
        Returns shopping totals derived from the plan's current assignments. Both
        revision and snapshot_id are required so a client can detect a changed
        fixture or plan between reads. Only the current snapshot is readable; this
        API does not expose historical revisions. If either supplied value differs
        from the current snapshot, the server returns 409 snapshot_changed and the
        client should refetch the plan, then its shopping list. Reads never generate
        or modify a plan. Purchased/checkmark state is not part of this response.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: revision
          in: query
          required: true
          description: Expected current persistent plan revision, starting at 1.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: snapshot_id
          in: query
          required: true
          description: Expected current opaque snapshot token.
          schema:
            type: string
            minLength: 1
          example: sha256:dc9d775df57fb9e8732a19a732587265639005a8ed19fbd40d6392d66d51fb80
      responses:
        '200':
          description: Shopping totals matching the current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
              examples:
                currentWeek:
                  summary: Shopping list matching revision 1
                  externalValue: examples/shopping-list.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Expected revision or snapshot token is stale.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                changedSnapshot:
                  summary: Refetch the plan and its shopping list
                  externalValue: examples/error-snapshot-changed.json
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/proposals:
    post:
      tags: [Proposals]
      operationId: proposeRegeneration
      summary: Preview a regenerated plan without changing the current revision
      description: |-
        Runs the solver and stores a short-lived proposal (expires_at, default 30 minutes).
        The current revision is not changed. changes lists per-slot differences;
        identical is true when nothing would change. plan and shopping_list are the full
        candidate content that accept would commit as revision base_revision + 1. Only
        future weeks may be regenerated. seed defaults to the current seed + 1. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        description: The revision the client is looking at, and an optional seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRequest'
      responses:
        '201':
          description: The stored proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: The expected revision is stale or the week is not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}:
    get:
      tags: [Proposals]
      operationId: getProposal
      summary: Read a stored proposal
      description: Returns the proposal while it is unexpired. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: The proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json

    delete:
      tags: [Proposals]
      operationId: discardProposal
      summary: Discard a proposal
      description: Drops the proposal; no revision is created. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '204':
          description: Proposal discarded.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}/accept:
    post:
      tags: [Proposals]
      operationId: acceptProposal
      summary: Commit a proposal as exactly one new revision
      description: |-
        Never re-solves. Commits the previewed content as revision N + 1 when the plan is
        still at expected_revision, the proposal is unexpired and based on that revision,
        and recipes, rules, and pantry are unchanged since the preview. An identical
        proposal returns changed: false and creates no revision. Retrying with the same
        Idempotency-Key and request replays the original result with replayed: true.
        Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                accepted:
                  summary: Accepted as revision 2
                  externalValue: examples/mutation-result.json
                replayed:
                  summary: Same Idempotency-Key retried
                  externalValue: examples/mutation-result-replayed.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '409':
          description: Stale revision, changed inputs, split linked pair, or week not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                basisChanged:
                  summary: Inputs changed after the preview
                  externalValue: examples/error-input-basis-changed.json
                pairSplit:
                  summary: Only half of a linked pair changed
                  externalValue: examples/error-linked-pair-split.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json
        '422':
          description: The Idempotency-Key was used for a different request.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json

  /api/v1/plans/{plan_id}/undo:
    post:
      tags: [Proposals]
      operationId: undoPlan
      summary: Restore the previous revision's content as a new revision
      description: |-
        Appends revision N + 1 whose content equals revision N - 1; history is never
        deleted. Undoing twice therefore returns to the later content. Idempotency-Key
        semantics match accept. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                undone:
                  summary: Undone as revision 3
                  externalValue: examples/mutation-result-undo.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Stale revision or nothing to undo.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                nothingToUndo:
                  summary: Plan is at revision 1
                  externalValue: examples/error-nothing-to-undo.json
        '422':
          description: The Idempotency-Key was used for a different request.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json

  /api/v1/plans/{plan_id}/revisions:
    get:
      tags: [Plans]
      operationId: listRevisions
      summary: List a plan's revision history
      description: Oldest first. Summaries only; revisions are immutable and never deleted. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Revision summaries.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
              examples:
                history:
                  summary: Three revisions
                  externalValue: examples/revisions.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'

  /api/v1/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: Read what this client may do
      description: |-
        can_edit_plans is true only when the API is backed by SQLite and the request
        comes from a loopback address. Clients must use it, never their own guess, to
        decide whether to offer editing. The server re-checks authorization on every
        mutation regardless of this value.
      responses:
        '200':
          description: Capabilities for this client.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                editable:
                  summary: Editing available
                  externalValue: examples/capabilities.json
components:
  parameters:
    PlanId:
      name: plan_id
      in: path
      required: true
      description: Opaque plan identifier; 1–128 ASCII letters, digits, underscores, or hyphens, beginning with a letter or digit. Invalid identifiers return 400.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: plan_2026_10_19
    ProposalId:
      name: proposal_id
      in: path
      required: true
      description: Opaque proposal identifier returned when the proposal was created.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: prop_9b1f0c2e4d5a4f7c8a3e6d1b2c0f4a55
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        Client-generated retry id, 1 to 128 printable ASCII characters. Reuse the same key
        to retry the same request safely (the original result is replayed with
        replayed: true). Reusing it for a different request returns 422 retry_id_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7e]+$'
      example: 3f0c8e52-6c1a-4d0e-9a53-0d6a2d9d7c11
  responses:
    WriteInvalidRequest:
      description: Malformed JSON body, unknown or invalid field, bad identifier, missing Idempotency-Key, or a week_start that is not a Monday (invalid_week).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
            missingKey:
              summary: Idempotency-Key header missing
              externalValue: examples/error-missing-idempotency-key.json
            invalidWeek:
              summary: week_start is not a Monday
              externalValue: examples/error-invalid-week.json
    WriteForbidden:
      description: Mutations and history need a loopback client (forbidden) and a SQLite-backed API (read_only, JSON snapshot mode).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Non-loopback client attempted a change
              externalValue: examples/error-forbidden.json
            readOnly:
              summary: API is serving the JSON snapshot
              externalValue: examples/error-read-only.json
    InvalidRequest:
      description: Missing or malformed input, or an invalid date range.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRange:
              summary: Range end precedes range start
              externalValue: examples/error-invalid-range.json
            invalidDate:
              summary: Date is not a calendar date in YYYY-MM-DD format
              externalValue: examples/error-invalid-date.json
            invalidRevision:
              summary: Revision must be a positive integer
              externalValue: examples/error-invalid-revision.json
    PlanNotFound:
      description: No plan exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownPlan:
              summary: Unknown plan identifier
              externalValue: examples/error-plan-not-found.json
    SourceFailure:
      description: The source is unavailable or contains invalid plan data.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              summary: Temporary source failure
              externalValue: examples/error-source-unavailable.json
            invalidSource:
              summary: Source data failed validation
              externalValue: examples/error-source-invalid.json
  schemas:
    PlanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
    PlanSummary:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: |-
            Opaque content token for the normalized plan and shopping payload, including
            the week anchor. The example token is SHA-256 over canonical UTF-8 JSON for
            {"plan": <plan object without snapshot_id>, "shopping_list": <shopping object
            without snapshot_id>}, with object keys sorted recursively, no insignificant
            whitespace, and ensure_ascii=false. Implementations may use another opaque
            token algorithm, but unchanged normalized content must retain its token.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed, slots, derived]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: Opaque content token shared with the matching shopping list.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
        slots:
          type: array
          description: Ordered by date, then lunch before dinner; no fixed maximum is imposed.
          items:
            $ref: '#/components/schemas/MealAssignment'
        derived:
          $ref: '#/components/schemas/PlanDerived'
    PlanDerived:
      type: object
      additionalProperties: false
      required: [protein_counts, carb_counts]
      properties:
        protein_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          required: [chicken, beef, pork, fish, egg]
          properties:
            chicken: {type: integer, minimum: 0}
            beef: {type: integer, minimum: 0}
            pork: {type: integer, minimum: 0}
            fish: {type: integer, minimum: 0}
            egg: {type: integer, minimum: 0}
        carb_counts:
          type: object
          description: Counts for carb ingredient IDs present in this plan.
          additionalProperties:
            type: integer
            minimum: 0
    MealAssignment:
      type: object
      additionalProperties: false
      required: [assignment_id, date, day, meal, recipe_id, recipe_name, variant_id, protein, protein_quantity, carb, carb_quantity, ingredients, extended_from_lunch, linked_assignment_id]
      properties:
        assignment_id:
          type: string
          minLength: 1
          description: Stable identity for this date and meal within its plan.
        date:
          type: string
          format: date
          description: Actual meal date within the plan's Monday-Sunday week.
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
          description: Weekday corresponding to date.
        meal:
          type: string
          enum: [lunch, dinner]
        recipe_id:
          type: string
          minLength: 1
        recipe_name:
          type: string
        variant_id:
          type: string
          minLength: 1
        protein:
          type: string
          enum: [chicken, beef, pork, fish, egg]
        protein_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Raw quantity of the protein ingredient, not nutritional protein weight.
        carb:
          type: [string, 'null']
          description: Carb ingredient ID, or null when the assignment has no carb.
        carb_quantity:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
          description: Null when carb is null; otherwise its raw ingredient amount.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/PlanIngredient'
        extended_from_lunch:
          type: boolean
          description: True for a dinner that reuses the same base recipe as lunch.
        linked_assignment_id:
          type: [string, 'null']
          description: Reciprocal assignment ID for a linked same-day lunch/dinner pair, otherwise null.
    Quantity:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
    PlanIngredient:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, role]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        role:
          type: string
          enum: [protein, protein_extra, veg, fat, condiment, garnish, herb, spice, dairy, other, carb]
          description: Recipe ingredient role; carb is added for the selected variant's carbohydrate ingredient.
    ShoppingList:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, week_start, week_end, sections]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        sections:
          type: object
          description: Map from shopping section name to its ingredient lines.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ShoppingLine'
    ShoppingLine:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, section, notes]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        notes:
          type: [string, 'null']
    Capabilities:
      type: object
      additionalProperties: false
      required: [can_edit_plans]
      properties:
        can_edit_plans:
          type: boolean
          description: True only for a loopback client of a SQLite-backed API.
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [week_start]
      properties:
        week_start:
          type: string
          format: date
          description: Monday of the household week to create.
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to 42.
    ProposeRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to the current plan seed + 1.
    ExpectedRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
    SlotChange:
      type: object
      additionalProperties: false
      required: [assignment_id, date, meal, kind, before, after]
      properties:
        assignment_id:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        meal:
          type: string
          enum: [lunch, dinner]
        kind:
          type: string
          enum: [changed, added, removed]
        before:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
        after:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
    Proposal:
      type: object
      additionalProperties: false
      required: [proposal_id, plan_id, base_revision, base_snapshot_id, seed, created_at, expires_at, identical, changes, plan, shopping_list]
      properties:
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        base_revision:
          type: integer
          minimum: 1
          description: The current revision this proposal was computed against.
        base_snapshot_id:
          type: string
          minLength: 1
        seed:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        identical:
          type: boolean
          description: True when accepting would change nothing; plan is then the current content.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SlotChange'
        plan:
          $ref: '#/components/schemas/Plan'
        shopping_list:
          $ref: '#/components/schemas/ShoppingList'
    MutationResult:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, changed, replayed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
          description: The current revision after the call (unchanged when changed is false).
        snapshot_id:
          type: string
          minLength: 1
        changed:
          type: boolean
        replayed:
          type: boolean
          description: True when this is a replay of an earlier request with the same Idempotency-Key.
    RevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, snapshot_id, source, created_at]
      properties:
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        source:
          type: string
          enum: [import, create, regenerate, undo]
        created_at:
          type: string
          format: date-time
    RevisionList:
      type: object
      additionalProperties: false
      required: [plan_id, items]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        items:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/RevisionSummary'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_week, forbidden, read_only, plan_not_found, snapshot_changed, source_unavailable, source_invalid, stale_revision, proposal_not_found, proposal_expired, input_basis_changed, retry_id_reused, nothing_to_undo, linked_pair_split, week_not_editable, duplicate_week, generation_failed, generation_busy]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
