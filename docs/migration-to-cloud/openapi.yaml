  /api/v1/shopping-trips/{trip_id}:
    get:
      tags: [Shopping trips]
      operationId: getShoppingTrip
      summary: Read one shopping trip
      description: |-
        Returns the trip with its weeks (coverage, used and current revision) and derived items: the sum, per ingredient and unit, of each covered week's saved grocery rows, with the contributing plan_ids. Items are never stored or edited and there is no pantry or purchase tracking. Item checkboxes are device-local and not part of this resource.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: The trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                open:
                  summary: Open trip
                  externalValue: examples/shopping-trip.json
                done:
                  summary: Done trip, week changed since shopping
                  externalValue: examples/shopping-trip-done.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '503':
          $ref: '#/components/responses/SourceFailure'
    delete:
      tags: [Shopping trips]
      operationId: deleteShoppingTrip
      summary: Delete a shopping trip
