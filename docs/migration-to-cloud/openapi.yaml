openapi: 3.1.0
info:
  title: Meal Prep API
  version: 0.1.0
  description: |-
    Versioned API for dated weekly meal plans and their current shopping snapshots.
    Reads are always available. Plan changes (create, propose, accept, discard, undo, swap)
    and revision history need a SQLite-backed server and a loopback client; the server
    rejects them otherwise (403 forbidden or read_only). Static publication stays
    read-only. This development API is intended to bind to loopback. It has no
    authentication scheme and is not ready for remote deployment. Household-only
    access protection is required before any remote exposure.
servers:
  - url: http://127.0.0.1:5000
    description: Local development server bound to loopback
security: []
tags:
  - name: Plans
    description: Dated weekly plans, their grocery snapshots, and revision history.
  - name: Proposals
    description: Preview, accept, discard, and undo plan changes.
  - name: Swaps
    description: Replace the recipe variant of a dated slot (weekly rules are advisory) and list the variants a slot can take.
  - name: Shopping trips
    description: Shopping trips (called shopping lists in the UI) that cover weekly plans, and week coverage.
  - name: Publishing
    description: Publish selected months to the public repository (loopback, SQLite-backed API with publishing configured).
  - name: Capabilities
    description: What the calling client may do.
paths:
  /api/v1/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Find plans overlapping a date range
      description: |-
        Returns plans whose Monday-through-Sunday calendar week inclusively overlaps
        the requested inclusive date range. The range must satisfy from <= to and
        contain at most 366 calendar days, counting both endpoints. Results are
        ordered by week_start ascending. An empty result is returned as items: [].
        Dates are calendar dates in the household timezone; current examples use
        America/Bogota. Reads never generate or modify a plan.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: Inclusive end date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-31'
      responses:
        '200':
          description: Matching current plan summaries, possibly an empty list.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
              examples:
                matchingPlan:
                  summary: One current plan
                  externalValue: examples/plans.json
                noMatchingPlans:
                  summary: No plans overlap this range
                  externalValue: examples/plans-empty.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/SourceFailure'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create revision 1 of the plan for a week
      description: |-
        Solves and stores a new plan for a current or future Monday-through-Sunday week
        (one plan per week); seed defaults to the week's deterministic seed (int(YYYYMMDD of its Monday) mod 2**31), as in a month fill. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden. Solver runs are bounded: at most
        MEALPLANNER_MAX_CONCURRENT_GENERATIONS run at once (others get 503 generation_busy,
        never queued) and each solve has a time limit (422 generation_failed). Every candidate is checked
        against the weekly rules (protein counts, adjacency, carbs, recipe limits, lunch/dinner
        linkage); a violating result is never stored (422 rule_violation, details lists
        field = rule code and message).
      requestBody:
        required: true
        description: Week to create and optional solver seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: The new plan at revision 1.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                created:
                  summary: Newly created plan
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '409':
          description: The week already has a plan, or has already ended.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateWeek:
                  summary: Week already has a plan
                  externalValue: examples/error-duplicate-week.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit (generation_failed), or the result broke weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json
  /api/v1/plans/{plan_id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Read a current weekly plan
      description: |-
        Returns the current snapshot for this plan. plan_id is opaque to clients.
        Slots are ordered by date, then lunch before dinner. The week starts Monday
        and week_end is the inclusive Sunday. Dates must fall within that week and
        agree with their day value. Assignment IDs are stable for a slot within a
        plan and unique within its snapshot. Where a lunch and dinner assignment
        are linked, linked_assignment_id is reciprocal and both use the same base
        recipe. extended_from_lunch identifies the dinner that extends its lunch.
        The initial source covers weekday cooking only, but the schema imposes no
        permanent maximum slot count. Protein quantities are raw protein ingredient
        amounts in their stated units, not nutritional protein weight. The seed is
        provenance and is not a plan identity or a promise of reproducibility.
        snapshot_id is an opaque content token, separate from the persistent integer
        revision. It remains stable for an unchanged normalized plan and shopping
        payload, and changes when either payload or its week anchor changes.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                currentWeek:
                  summary: Current plan for week beginning October 19, 2026
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/shopping-list:
    get:
      tags: [Plans]
      operationId: getShoppingList
      summary: Read the shopping list for the current plan snapshot
      description: |-
        Returns shopping totals derived from the plan's current assignments. Both
        revision and snapshot_id are required so a client can detect a changed
        fixture or plan between reads. Only the current snapshot is readable; this
        API does not expose historical revisions. If either supplied value differs
        from the current snapshot, the server returns 409 snapshot_changed and the
        client should refetch the plan, then its shopping list. Reads never generate
        or modify a plan. Purchased/checkmark state is not part of this response.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: revision
          in: query
          required: true
          description: Expected current persistent plan revision, starting at 1.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: snapshot_id
          in: query
          required: true
          description: Expected current opaque snapshot token.
          schema:
            type: string
            minLength: 1
          example: sha256:dc9d775df57fb9e8732a19a732587265639005a8ed19fbd40d6392d66d51fb80
      responses:
        '200':
          description: Shopping totals matching the current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
              examples:
                currentWeek:
                  summary: Shopping list matching revision 1
                  externalValue: examples/shopping-list.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Expected revision or snapshot token is stale.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                changedSnapshot:
                  summary: Refetch the plan and its shopping list
                  externalValue: examples/error-snapshot-changed.json
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/proposals:
    post:
      tags: [Proposals]
      operationId: proposeRegeneration
      summary: Preview a regenerated plan without changing the current revision
      description: |-
        Runs the solver and stores a short-lived proposal (expires_at, default 30 minutes).
        The current revision is not changed. changes lists per-slot differences;
        identical is true when nothing would change. plan and shopping_list are the full
        candidate content that accept would commit as revision base_revision + 1. Only
        future weeks may be regenerated. seed defaults to a fresh random seed (different from the current one), recorded in the proposal. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        description: The revision the client is looking at, and an optional seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRequest'
      responses:
        '201':
          description: The stored proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: The expected revision is stale or the week is not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit (generation_failed), or the result broke weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}:
    get:
      tags: [Proposals]
      operationId: getProposal
      summary: Read a stored proposal
      description: Returns the proposal while it is unexpired. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: The proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json

    delete:
      tags: [Proposals]
      operationId: discardProposal
      summary: Discard a proposal
      description: Drops the proposal; no revision is created. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '204':
          description: Proposal discarded.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}/accept:
    post:
      tags: [Proposals]
      operationId: acceptProposal
      summary: Commit a proposal as exactly one new revision
      description: |-
        Never re-solves. Commits the previewed content as revision N + 1 when the plan is
        still at expected_revision, the proposal is unexpired and based on that revision,
        and recipes, rules, and pantry are unchanged since the preview. An identical
        proposal returns changed: false and creates no revision. Retrying with the same
        Idempotency-Key and request replays the original result with replayed: true.
        Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                accepted:
                  summary: Accepted as revision 2
                  externalValue: examples/mutation-result.json
                replayed:
                  summary: Same Idempotency-Key retried
                  externalValue: examples/mutation-result-replayed.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '409':
          description: Stale revision, changed inputs, split linked pair, or week not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                basisChanged:
                  summary: Inputs changed after the preview
                  externalValue: examples/error-input-basis-changed.json
                pairSplit:
                  summary: Only half of a linked pair changed
                  externalValue: examples/error-linked-pair-split.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json
        '422':
          description: The Idempotency-Key was used for a different request (retry_id_reused), or the content to commit breaks weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json

  /api/v1/plans/{plan_id}/undo:
    post:
      tags: [Proposals]
      operationId: undoPlan
      summary: Restore the previous revision's content as a new revision
      description: |-
        Appends revision N + 1 whose content equals revision N - 1; history is never
        deleted. Undoing twice therefore returns to the later content. Idempotency-Key
        semantics match accept. Weekly rules are advisory for undo: restoring a revision that
        violates them (for example a swapped week) is allowed and never refused. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                undone:
                  summary: Undone as revision 3
                  externalValue: examples/mutation-result-undo.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Stale revision or nothing to undo.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                nothingToUndo:
                  summary: Plan is at revision 1
                  externalValue: examples/error-nothing-to-undo.json
        '422':
          description: The Idempotency-Key was used for a different request (retry_id_reused); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json

  /api/v1/catalog/variants:
    get:
      tags: [Swaps]
      operationId: listSwapVariants
      summary: List every recipe variant a slot can be swapped to
      description: |-
        Reads the current planner inputs (recipes and ingredients), not any plan. Every
        recipe variant is listed, whatever meal it suits: weekly rules are advisory for
        swaps. name is the display name plans show for that variant (recipe_name in a
        slot). carb is the carb ingredient ID or null. Sorted by name, then variant_id.
        Open read like the other reads, but it needs the SQLite-backed API: in JSON
        snapshot mode (no planner inputs) it returns 503 source_unavailable.
      responses:
        '200':
          description: The swappable variants.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapVariantList'
              examples:
                variants:
                  summary: A few variants (the real list has every catalog variant)
                  externalValue: examples/swap-variants.json
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/swaps/preview:
    post:
      tags: [Swaps]
      operationId: previewSwap
      summary: Preview a meal swap without storing anything
      description: |-
        Stateless: nothing is stored and no revision is created. Returns the slot changes
        (same items as a proposal), the week's grocery delta, the weekly-rule violations the
        swapped plan would have (advisory, never blocking), and the shopping trip impact.
        scope pair swaps a linked lunch/dinner together and keeps them linked; on an unlinked
        slot it equals single. scope single swaps only that slot and removes the link from
        both halves. The swapped-in recipe is not extended to dinner automatically.
        Groceries use the base revision's captured pantry. grocery_delta lists only changed
        ingredient/unit rows (before and after are 0 when absent), sorted by section, then
        display. trip is null when the week is on no shopping trip; otherwise it names the trip
        and its status. extra_needed is non-empty only for a done trip: the positive quantity
        differences between the swapped week's groceries and the week's groceries at the
        revision the trip covered. A swap to the variant already in the slot previews as no
        change (empty changes and grocery_delta). Only slots dated today or later in the
        household timezone can be swapped, including slots of a started week. Requires a
        SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        description: The slot, the variant to put there, the scope, and the revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      responses:
        '200':
          description: What the swap would do.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapPreview'
              examples:
                openTrip:
                  summary: Linked pair swapped, week on an open shopping list
                  externalValue: examples/swap-preview.json
                doneTrip:
                  summary: Week on a done shopping list that now needs extra items
                  externalValue: examples/swap-preview-done-trip.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan, slot, or variant.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownPlan:
                  summary: Unknown plan identifier
                  externalValue: examples/error-plan-not-found.json
                unknownSlot:
                  summary: The plan has no such slot_id
                  externalValue: examples/error-slot-not-found.json
                unknownVariant:
                  summary: The catalog has no such variant_id
                  externalValue: examples/error-variant-not-found.json
        '409':
          description: Stale revision, or the slot is dated before today.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                slotNotEditable:
                  summary: The slot is dated before today
                  externalValue: examples/error-slot-not-editable.json
  /api/v1/plans/{plan_id}/swaps:
    post:
      tags: [Swaps]
      operationId: applySwap
      summary: Swap a meal as exactly one new revision
      description: |-
        Applies the swap described by POST .../swaps/preview as revision N + 1: the slot (and
        its linked partner for scope pair) takes the variant's recipe, protein, carb and
        ingredient quantities; assignment_id, date and meal stay; every other assignment is
        preserved exactly. Derived counts and groceries are recomputed from the saved
        assignments and the base revision's captured pantry, under a new snapshot_id. Weekly
        rules never block a swap: rule_warnings lists the violations the resulting plan has.
        Responds 201 with the new plan. Swapping a slot to the variant it already has changes
        nothing and creates no revision: the response is 200 with the current plan. Retrying with
        the same Idempotency-Key and the same body returns the original result (200, no new
        revision); the same key with a different body is 422 retry_id_reused. A stale
        expected_revision is 409 stale_revision. Requires a SQLite-backed API and a loopback
        client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The slot, the variant, the scope, and the revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      responses:
        '200':
          description: Nothing changed (the slot already had that variant) or a replay of an earlier request with the same Idempotency-Key. The plan is the revision that request resulted in.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResult'
              examples:
                noop:
                  summary: Swapped to the variant already there
                  externalValue: examples/swap-result-noop.json
        '201':
          description: The swap was applied as a new revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the swapped plan.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResult'
              examples:
                swapped:
                  summary: Linked pair swapped as revision 2, with a rule warning
                  externalValue: examples/swap-result.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan, slot, or variant.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownPlan:
                  summary: Unknown plan identifier
                  externalValue: examples/error-plan-not-found.json
                unknownSlot:
                  summary: The plan has no such slot_id
                  externalValue: examples/error-slot-not-found.json
                unknownVariant:
                  summary: The catalog has no such variant_id
                  externalValue: examples/error-variant-not-found.json
        '409':
          description: Stale revision, or the slot is dated before today.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                slotNotEditable:
                  summary: The slot is dated before today
                  externalValue: examples/error-slot-not-editable.json
        '422':
          description: The Idempotency-Key was used for a different request (retry_id_reused); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json

  /api/v1/plans/{plan_id}/revisions:
    get:
      tags: [Plans]
      operationId: listRevisions
      summary: List a plan's revision history
      description: Oldest first. Summaries only; revisions are immutable and never deleted. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Revision summaries.
          headers:
