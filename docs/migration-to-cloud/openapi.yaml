        Returns a done trip to open; items follow the weeks' current revisions again. 409 trip_not_done when the trip is already open. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        description: The trip version the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
