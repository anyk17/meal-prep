  /api/v1/shopping-trips/{trip_id}/weeks/{plan_id}:
    delete:
      tags: [Shopping trips]
      operationId: removeShoppingTripWeek
      summary: Remove a week from an open trip
      description: |-
        Removes the plan's week from an open trip. 409 trip_done on a done trip (reopen it first), 409 last_week for the last remaining week (delete the trip instead), 404 week_not_on_trip when the plan is not on this trip. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
