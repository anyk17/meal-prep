openapi: 3.1.0
info:
  title: Meal Prep API
  version: 0.1.0
  description: |-
    Versioned API for dated weekly meal plans and their current shopping snapshots.
    Reads are always available. Plan changes (create, propose, accept, discard, undo)
    and revision history need a SQLite-backed server and a loopback client; the server
    rejects them otherwise (403 forbidden or read_only). Static publication stays
    read-only. This development API is intended to bind to loopback. It has no
    authentication scheme and is not ready for remote deployment. Household-only
    access protection is required before any remote exposure.
servers:
  - url: http://127.0.0.1:5000
    description: Local development server bound to loopback
security: []
tags:
  - name: Plans
    description: Dated weekly plans, their grocery snapshots, and revision history.
  - name: Proposals
    description: Preview, accept, discard, and undo plan changes.
  - name: Shopping trips
    description: Shopping trips (called shopping lists in the UI) that cover weekly plans, and week coverage.
  - name: Capabilities
    description: What the calling client may do.
paths:
  /api/v1/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Find plans overlapping a date range
      description: |-
        Returns plans whose Monday-through-Sunday calendar week inclusively overlaps
        the requested inclusive date range. The range must satisfy from <= to and
        contain at most 366 calendar days, counting both endpoints. Results are
        ordered by week_start ascending. An empty result is returned as items: [].
        Dates are calendar dates in the household timezone; current examples use
        America/Bogota. Reads never generate or modify a plan.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: Inclusive end date in ISO 8601 YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: '2026-10-31'
      responses:
        '200':
          description: Matching current plan summaries, possibly an empty list.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
              examples:
                matchingPlan:
                  summary: One current plan
                  externalValue: examples/plans.json
                noMatchingPlans:
                  summary: No plans overlap this range
                  externalValue: examples/plans-empty.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/SourceFailure'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create revision 1 of the plan for a week
      description: |-
        Solves and stores a new plan for a current or future Monday-through-Sunday week
        (one plan per week); seed defaults to 42. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden. Solver runs are bounded: at most
        MEALPLANNER_MAX_CONCURRENT_GENERATIONS run at once (others get 503 generation_busy,
        never queued) and each solve has a time limit (422 generation_failed). Every candidate is checked
        against the weekly rules (protein counts, adjacency, carbs, recipe limits, lunch/dinner
        linkage); a violating result is never stored (422 rule_violation, details lists
        field = rule code and message).
      requestBody:
        required: true
        description: Week to create and optional solver seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: The new plan at revision 1.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                created:
                  summary: Newly created plan
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '409':
          description: The week already has a plan, or has already ended.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateWeek:
                  summary: Week already has a plan
                  externalValue: examples/error-duplicate-week.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit (generation_failed), or the result broke weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json
  /api/v1/plans/{plan_id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Read a current weekly plan
      description: |-
        Returns the current snapshot for this plan. plan_id is opaque to clients.
        Slots are ordered by date, then lunch before dinner. The week starts Monday
        and week_end is the inclusive Sunday. Dates must fall within that week and
        agree with their day value. Assignment IDs are stable for a slot within a
        plan and unique within its snapshot. Where a lunch and dinner assignment
        are linked, linked_assignment_id is reciprocal and both use the same base
        recipe. extended_from_lunch identifies the dinner that extends its lunch.
        The initial source covers weekday cooking only, but the schema imposes no
        permanent maximum slot count. Protein quantities are raw protein ingredient
        amounts in their stated units, not nutritional protein weight. The seed is
        provenance and is not a plan identity or a promise of reproducibility.
        snapshot_id is an opaque content token, separate from the persistent integer
        revision. It remains stable for an unchanged normalized plan and shopping
        payload, and changes when either payload or its week anchor changes.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                currentWeek:
                  summary: Current plan for week beginning October 19, 2026
                  externalValue: examples/plan.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/shopping-list:
    get:
      tags: [Plans]
      operationId: getShoppingList
      summary: Read the shopping list for the current plan snapshot
      description: |-
        Returns shopping totals derived from the plan's current assignments. Both
        revision and snapshot_id are required so a client can detect a changed
        fixture or plan between reads. Only the current snapshot is readable; this
        API does not expose historical revisions. If either supplied value differs
        from the current snapshot, the server returns 409 snapshot_changed and the
        client should refetch the plan, then its shopping list. Reads never generate
        or modify a plan. Purchased/checkmark state is not part of this response.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: revision
          in: query
          required: true
          description: Expected current persistent plan revision, starting at 1.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: snapshot_id
          in: query
          required: true
          description: Expected current opaque snapshot token.
          schema:
            type: string
            minLength: 1
          example: sha256:dc9d775df57fb9e8732a19a732587265639005a8ed19fbd40d6392d66d51fb80
      responses:
        '200':
          description: Shopping totals matching the current plan snapshot.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
              examples:
                currentWeek:
                  summary: Shopping list matching revision 1
                  externalValue: examples/shopping-list.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Expected revision or snapshot token is stale.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                changedSnapshot:
                  summary: Refetch the plan and its shopping list
                  externalValue: examples/error-snapshot-changed.json
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/plans/{plan_id}/proposals:
    post:
      tags: [Proposals]
      operationId: proposeRegeneration
      summary: Preview a regenerated plan without changing the current revision
      description: |-
        Runs the solver and stores a short-lived proposal (expires_at, default 30 minutes).
        The current revision is not changed. changes lists per-slot differences;
        identical is true when nothing would change. plan and shopping_list are the full
        candidate content that accept would commit as revision base_revision + 1. Only
        future weeks may be regenerated. seed defaults to the current seed + 1. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        description: The revision the client is looking at, and an optional seed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRequest'
      responses:
        '201':
          description: The stored proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: The expected revision is stale or the week is not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '422':
          description: The solver found no valid plan or hit its time limit (generation_failed), or the result broke weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationFailed:
                  summary: Solver failed or timed out; nothing stored
                  externalValue: examples/error-generation-failed.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}:
    get:
      tags: [Proposals]
      operationId: getProposal
      summary: Read a stored proposal
      description: Returns the proposal while it is unexpired. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: The proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              examples:
                proposal:
                  summary: Proposal with one changed slot
                  externalValue: examples/proposal.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json

    delete:
      tags: [Proposals]
      operationId: discardProposal
      summary: Discard a proposal
      description: Drops the proposal; no revision is created. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '204':
          description: Proposal discarded.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json

  /api/v1/plans/{plan_id}/proposals/{proposal_id}/accept:
    post:
      tags: [Proposals]
      operationId: acceptProposal
      summary: Commit a proposal as exactly one new revision
      description: |-
        Never re-solves. Commits the previewed content as revision N + 1 when the plan is
        still at expected_revision, the proposal is unexpired and based on that revision,
        and recipes, rules, and pantry are unchanged since the preview. An identical
        proposal returns changed: false and creates no revision. Retrying with the same
        Idempotency-Key and request replays the original result with replayed: true.
        Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                accepted:
                  summary: Accepted as revision 2
                  externalValue: examples/mutation-result.json
                replayed:
                  summary: Same Idempotency-Key retried
                  externalValue: examples/mutation-result-replayed.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          description: Unknown plan or proposal.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProposal:
                  summary: Proposal discarded, accepted, or never existed
                  externalValue: examples/error-proposal-not-found.json
        '409':
          description: Stale revision, changed inputs, split linked pair, or week not editable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                basisChanged:
                  summary: Inputs changed after the preview
                  externalValue: examples/error-input-basis-changed.json
                pairSplit:
                  summary: Only half of a linked pair changed
                  externalValue: examples/error-linked-pair-split.json
                notEditable:
                  summary: Week has already started
                  externalValue: examples/error-week-not-editable.json
        '410':
          description: The proposal expired.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expiredProposal:
                  summary: Proposal is past expires_at
                  externalValue: examples/error-proposal-expired.json
        '422':
          description: The Idempotency-Key was used for a different request (retry_id_reused), or the content to commit breaks weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json

  /api/v1/plans/{plan_id}/undo:
    post:
      tags: [Proposals]
      operationId: undoPlan
      summary: Restore the previous revision's content as a new revision
      description: |-
        Appends revision N + 1 whose content equals revision N - 1; history is never
        deleted. Undoing twice therefore returns to the later content. Idempotency-Key
        semantics match accept. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The revision the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: The resulting revision.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
              examples:
                undone:
                  summary: Undone as revision 3
                  externalValue: examples/mutation-result-undo.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: Stale revision or nothing to undo.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                staleRevision:
                  summary: expected_revision is behind the current revision
                  externalValue: examples/error-stale-revision.json
                nothingToUndo:
                  summary: Plan is at revision 1
                  externalValue: examples/error-nothing-to-undo.json
        '422':
          description: The Idempotency-Key was used for a different request (retry_id_reused), or the content to commit breaks weekly rules (rule_violation); nothing was stored.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reusedKey:
                  summary: Same key, different request
                  externalValue: examples/error-retry-id-reused.json
                ruleViolation:
                  summary: A candidate broke weekly rules; nothing stored
                  externalValue: examples/error-rule-violation.json

  /api/v1/plans/{plan_id}/revisions:
    get:
      tags: [Plans]
      operationId: listRevisions
      summary: List a plan's revision history
      description: Oldest first. Summaries only; revisions are immutable and never deleted. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Revision summaries.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
              examples:
                history:
                  summary: Three revisions
                  externalValue: examples/revisions.json
        '400':
          $ref: '#/components/responses/WriteInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'

  /api/v1/months/{month}/fill:
    post:
      tags: [Plans]
      operationId: fillMonth
      summary: Create the missing weekly plans for a month
      description: |-
        Batch of independent weekly plans; there are no monthly or cross-week rules.
        Covers every Monday-Sunday week overlapping the month (4 to 6 weeks, including
        weeks crossing either boundary), in order. Weeks that already ended are
        skipped_past; weeks that already have a plan are reported as exists and are
        never overwritten or regenerated; every other week is created as revision 1
        with a seed derived deterministically from its Monday (int(YYYYMMDD) mod 2^31).
        Each created week commits independently, so a failed week (status failed with an
        error code and message) does not stop or undo the others. Solves run
        sequentially and the whole fill holds one generation slot (503 generation_busy
        when busy). The call can take as long as one solve per created week. Requires a
        SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/Month'
      requestBody:
        required: true
        description: An empty JSON object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillMonthRequest'
      responses:
        '200':
          description: One outcome per week, in week order.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthFillResult'
              examples:
                filled:
                  summary: Past weeks skipped, an existing week kept, one week created
                  externalValue: examples/month-fill-result.json
                partial:
                  summary: One week failed; the others were still created
                  externalValue: examples/month-fill-result-partial.json
        '400':
          description: Malformed month, malformed JSON body, or unknown body field.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidMonth:
                  summary: month is not YYYY-MM
                  externalValue: examples/error-invalid-month.json
                unknownField:
                  summary: Invalid or unknown body field
                  externalValue: examples/error-invalid-body.json
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '503':
          description: Generation is busy (Retry-After given) or the database is unavailable.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generationBusy:
                  summary: Solver concurrency bound reached
                  externalValue: examples/error-generation-busy.json

  /api/v1/shopping-trips:
    get:
      tags: [Shopping trips]
      operationId: listShoppingTrips
      summary: List shopping trips
      description: |-
        Every shopping trip (shown to users as a "shopping list"), oldest first, each with its weeks and derived items. Open trips follow the weeks' current revisions; done trips are frozen to the revisions they covered. When the API is not SQLite-backed the list is empty.
      responses:
        '200':
          description: Shopping trips, possibly an empty list.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTripList'
              examples:
                trips:
                  summary: One open trip
                  externalValue: examples/shopping-trips.json
                noTrips:
                  summary: No trips yet
                  externalValue: examples/shopping-trips-empty.json
        '503':
          $ref: '#/components/responses/SourceFailure'
    post:
      tags: [Shopping trips]
      operationId: createShoppingTrip
      summary: Create an open shopping trip for weeks
      description: |-
        Creates an open trip (version 1) covering the given plans. A plan belongs to at most one trip of any status (409 week_already_on_trip). name is an optional short label; it defaults to the covered date range. Trips never modify plans or create plan revisions. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      requestBody:
        required: true
        description: Plans to cover and an optional label.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingTripRequest'
      responses:
        '201':
          description: The new trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                created:
                  summary: Newly created open trip
                  externalValue: examples/shopping-trip.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/shopping-trips/{trip_id}:
    get:
      tags: [Shopping trips]
      operationId: getShoppingTrip
      summary: Read one shopping trip
      description: |-
        Returns the trip with its weeks (coverage, used and current revision) and derived items: the sum, per ingredient and unit, of each covered week's saved grocery rows, with the contributing plan_ids. Items are never stored or edited and there is no pantry or purchase tracking. Item checkboxes are device-local and not part of this resource.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: The trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                open:
                  summary: Open trip
                  externalValue: examples/shopping-trip.json
                done:
                  summary: Done trip, week changed since shopping
                  externalValue: examples/shopping-trip-done.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '503':
          $ref: '#/components/responses/SourceFailure'
    delete:
      tags: [Shopping trips]
      operationId: deleteShoppingTrip
      summary: Delete a shopping trip
      description: |-
        Deletes the trip in any status, which frees its weeks. Plans are untouched. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: Trip deleted.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/shopping-trips/{trip_id}/weeks:
    post:
      tags: [Shopping trips]
      operationId: addShoppingTripWeek
      summary: Add a week to an open trip
      description: |-
        Adds a plan's week to an open trip. 409 trip_done when the trip is done (reopen it first), 409 week_already_on_trip when the plan is already on a trip. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        description: The plan to add and the trip version the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTripWeekRequest'
      responses:
        '200':
          description: The updated trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                updated:
                  summary: Trip with the new week
                  externalValue: examples/shopping-trip.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TripOrPlanNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/shopping-trips/{trip_id}/weeks/{plan_id}:
    delete:
      tags: [Shopping trips]
      operationId: removeShoppingTripWeek
      summary: Remove a week from an open trip
      description: |-
        Removes the plan's week from an open trip. 409 trip_done on a done trip (reopen it first), 409 last_week for the last remaining week (delete the trip instead), 404 week_not_on_trip when the plan is not on this trip. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: The updated trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                updated:
                  summary: Trip without the week
                  externalValue: examples/shopping-trip.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TripOrPlanNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/shopping-trips/{trip_id}/done:
    post:
      tags: [Shopping trips]
      operationId: markShoppingTripDone
      summary: Mark a trip done
      description: |-
        Records, for every week, the plan's current revision and snapshot_id; items are frozen to those revisions from now on. 409 trip_not_done when the trip is already done. A plan edited afterwards only shows changed_since_shopping on its week. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        description: The trip version the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
        '200':
          description: The done trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                done:
                  summary: Done trip
                  externalValue: examples/shopping-trip-done.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/shopping-trips/{trip_id}/reopen:
    post:
      tags: [Shopping trips]
      operationId: reopenShoppingTrip
      summary: Reopen a done trip
      description: |-
        Returns a done trip to open; items follow the weeks' current revisions again. 409 trip_not_done when the trip is already open. Requires a SQLite-backed API and a loopback client; otherwise 403 read_only or forbidden.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        description: The trip version the client is looking at.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
        '200':
          description: The reopened trip.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTrip'
              examples:
                reopened:
                  summary: Open trip
                  externalValue: examples/shopping-trip.json
        '400':
          $ref: '#/components/responses/TripInvalidRequest'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/TripConflict'
  /api/v1/coverage:
    get:
      tags: [Shopping trips]
      operationId: getCoverage
      summary: Read week coverage for a date range
      description: |-
        For every plan whose Monday-through-Sunday week overlaps the inclusive range (same range rules as listPlans), reports coverage derived from shopping trips: not_covered (no trip), on_list (open trip) or covered (done trip), with the trip_id and changed_since_shopping (true when the plan's current revision is newer than the revision the done trip covered). Coverage is never stored on the plan, so plan summaries are unchanged. When the API is not SQLite-backed every plan is not_covered.
      parameters:
        - $ref: '#/components/parameters/CoverageFrom'
        - $ref: '#/components/parameters/CoverageTo'
      responses:
        '200':
          description: Per-plan coverage, ordered by week_start.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageList'
              examples:
                coverage:
                  summary: Covered, on a list, and not covered
                  externalValue: examples/coverage.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/SourceFailure'
  /api/v1/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: Read what this client may do
      description: |-
        can_edit_plans and can_edit_shopping_trips are true only when the API is backed by
        SQLite and the request comes from a loopback address. Clients must use it, never their own guess, to
        decide whether to offer editing. The server re-checks authorization on every
        mutation regardless of this value.
      responses:
        '200':
          description: Capabilities for this client.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                editable:
                  summary: Editing available
                  externalValue: examples/capabilities.json
components:
  parameters:
    Month:
      name: month
      in: path
      required: true
      description: Calendar month as YYYY-MM.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-10'
    PlanId:
      name: plan_id
      in: path
      required: true
      description: Opaque plan identifier; 1–128 ASCII letters, digits, underscores, or hyphens, beginning with a letter or digit. Invalid identifiers return 400.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: plan_2026_10_19
    ProposalId:
      name: proposal_id
      in: path
      required: true
      description: Opaque proposal identifier returned when the proposal was created.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: prop_9b1f0c2e4d5a4f7c8a3e6d1b2c0f4a55
    TripId:
      name: trip_id
      in: path
      required: true
      description: Opaque shopping trip identifier; 1–128 ASCII letters, digits, underscores, or hyphens, beginning with a letter or digit.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      example: trip_5c1e9a7f3b2d4e6f8a0b1c2d3e4f5a6b
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      description: The trip version the client is looking at (DELETE has no body). A mismatch returns 409 stale_version.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 2
    CoverageFrom:
      name: from
      in: query
      required: true
      description: Inclusive start date in ISO 8601 YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    CoverageTo:
      name: to
      in: query
      required: true
      description: Inclusive end date in ISO 8601 YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: '2026-10-31'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        Client-generated retry id, 1 to 128 printable ASCII characters. Reuse the same key
        to retry the same request safely (the original result is replayed with
        replayed: true). Reusing it for a different request returns 422 retry_id_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7e]+$'
      example: 3f0c8e52-6c1a-4d0e-9a53-0d6a2d9d7c11
  responses:
    WriteInvalidRequest:
      description: Malformed JSON body, unknown or invalid field, bad identifier, missing Idempotency-Key, or a week_start that is not a Monday (invalid_week).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
            missingKey:
              summary: Idempotency-Key header missing
              externalValue: examples/error-missing-idempotency-key.json
            invalidWeek:
              summary: week_start is not a Monday
              externalValue: examples/error-invalid-week.json
    WriteForbidden:
      description: Mutations and history need a loopback client (forbidden) and a SQLite-backed API (read_only, JSON snapshot mode).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Non-loopback client attempted a change
              externalValue: examples/error-forbidden.json
            readOnly:
              summary: API is serving the JSON snapshot
              externalValue: examples/error-read-only.json
    TripInvalidRequest:
      description: Malformed JSON body, unknown or invalid field, bad identifier, or a missing or invalid expected_version.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownField:
              summary: Invalid or unknown body field
              externalValue: examples/error-invalid-body.json
    TripNotFound:
      description: No shopping trip exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownTrip:
              summary: Unknown trip identifier
              externalValue: examples/error-trip-not-found.json
    TripOrPlanNotFound:
      description: Unknown trip (trip_not_found), unknown plan (plan_not_found), or a plan that is not on the trip (week_not_on_trip).
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownTrip:
              summary: Unknown trip identifier
              externalValue: examples/error-trip-not-found.json
            unknownPlan:
              summary: Unknown plan identifier
              externalValue: examples/error-plan-not-found.json
            weekNotOnTrip:
              summary: Plan is not on this trip
              externalValue: examples/error-week-not-on-trip.json
    TripConflict:
      description: stale_version (expected_version is behind), week_already_on_trip, trip_done (needs an open trip), trip_not_done (needs a done trip), or last_week. Nothing was changed.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            staleVersion:
              summary: expected_version is behind the current version
              externalValue: examples/error-stale-version.json
            weekAlreadyOnTrip:
              summary: Plan is already on a trip
              externalValue: examples/error-week-already-on-trip.json
            tripDone:
              summary: Trip is done; reopen it first
              externalValue: examples/error-trip-done.json
            tripNotDone:
              summary: Trip is not done
              externalValue: examples/error-trip-not-done.json
            lastWeek:
              summary: Cannot remove the only week
              externalValue: examples/error-last-week.json
    InvalidRequest:
      description: Missing or malformed input, or an invalid date range.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRange:
              summary: Range end precedes range start
              externalValue: examples/error-invalid-range.json
            invalidDate:
              summary: Date is not a calendar date in YYYY-MM-DD format
              externalValue: examples/error-invalid-date.json
            invalidRevision:
              summary: Revision must be a positive integer
              externalValue: examples/error-invalid-revision.json
    PlanNotFound:
      description: No plan exists for the requested identifier.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownPlan:
              summary: Unknown plan identifier
              externalValue: examples/error-plan-not-found.json
    SourceFailure:
      description: The source is unavailable or contains invalid plan data.
      headers:
        Cache-Control:
          description: Responses are not stored by caches.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              summary: Temporary source failure
              externalValue: examples/error-source-unavailable.json
            invalidSource:
              summary: Source data failed validation
              externalValue: examples/error-source-invalid.json
  schemas:
    PlanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
    PlanSummary:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: |-
            Opaque content token for the normalized plan and shopping payload, including
            the week anchor. The example token is SHA-256 over canonical UTF-8 JSON for
            {"plan": <plan object without snapshot_id>, "shopping_list": <shopping object
            without snapshot_id>}, with object keys sorted recursively, no insignificant
            whitespace, and ensure_ascii=false. Implementations may use another opaque
            token algorithm, but unchanged normalized content must retain its token.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, timezone, revision, snapshot_id, generated_at, seed, slots, derived]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Opaque stable identity for the saved calendar week.
        week_start:
          type: string
          format: date
          description: Monday date for this plan's calendar week.
        week_end:
          type: string
          format: date
          description: Inclusive Sunday date for this plan's calendar week.
        timezone:
          type: string
          description: IANA timezone used to interpret meal dates.
          example: America/Bogota
        revision:
          type: integer
          minimum: 1
          description: Current persistent plan revision; the initial fixture uses revision 1.
        snapshot_id:
          type: string
          minLength: 1
          description: Opaque content token shared with the matching shopping list.
        generated_at:
          type: string
          format: date-time
          description: Source generation timestamp. It does not determine week_start.
        seed:
          type: integer
          description: Solver seed recorded as provenance.
        slots:
          type: array
          description: Ordered by date, then lunch before dinner; no fixed maximum is imposed.
          items:
            $ref: '#/components/schemas/MealAssignment'
        derived:
          $ref: '#/components/schemas/PlanDerived'
    PlanDerived:
      type: object
      additionalProperties: false
      required: [protein_counts, carb_counts]
      properties:
        protein_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          required: [chicken, beef, pork, fish, egg]
          properties:
            chicken: {type: integer, minimum: 0}
            beef: {type: integer, minimum: 0}
            pork: {type: integer, minimum: 0}
            fish: {type: integer, minimum: 0}
            egg: {type: integer, minimum: 0}
        carb_counts:
          type: object
          description: Counts for carb ingredient IDs present in this plan.
          additionalProperties:
            type: integer
            minimum: 0
    MealAssignment:
      type: object
      additionalProperties: false
      required: [assignment_id, date, day, meal, recipe_id, recipe_name, variant_id, protein, protein_quantity, carb, carb_quantity, ingredients, extended_from_lunch, linked_assignment_id]
      properties:
        assignment_id:
          type: string
          minLength: 1
          description: Stable identity for this date and meal within its plan.
        date:
          type: string
          format: date
          description: Actual meal date within the plan's Monday-Sunday week.
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
          description: Weekday corresponding to date.
        meal:
          type: string
          enum: [lunch, dinner]
        recipe_id:
          type: string
          minLength: 1
        recipe_name:
          type: string
        variant_id:
          type: string
          minLength: 1
        protein:
          type: string
          enum: [chicken, beef, pork, fish, egg]
        protein_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Raw quantity of the protein ingredient, not nutritional protein weight.
        carb:
          type: [string, 'null']
          description: Carb ingredient ID, or null when the assignment has no carb.
        carb_quantity:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
          description: Null when carb is null; otherwise its raw ingredient amount.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/PlanIngredient'
        extended_from_lunch:
          type: boolean
          description: True for a dinner that reuses the same base recipe as lunch.
        linked_assignment_id:
          type: [string, 'null']
          description: Reciprocal assignment ID for a linked same-day lunch/dinner pair, otherwise null.
    Quantity:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
    PlanIngredient:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, role]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        role:
          type: string
          enum: [protein, protein_extra, veg, fat, condiment, garnish, herb, spice, dairy, other, carb]
          description: Recipe ingredient role; carb is added for the selected variant's carbohydrate ingredient.
    ShoppingList:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, week_start, week_end, sections]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        sections:
          type: object
          description: Map from shopping section name to its ingredient lines.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ShoppingLine'
    ShoppingLine:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, section, notes]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        notes:
          type: [string, 'null']
    Capabilities:
      type: object
      additionalProperties: false
      required: [can_edit_plans, can_edit_shopping_trips]
      properties:
        can_edit_plans:
          type: boolean
          description: True only for a loopback client of a SQLite-backed API.
        can_edit_shopping_trips:
          type: boolean
          description: True under the same conditions; gates creating, changing, finishing, and deleting shopping trips.
    FillMonthRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Empty object; the month comes from the path.
    WeekFillOutcome:
      type: object
      additionalProperties: false
      required: [week_start, week_end, status]
      properties:
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        status:
          type: string
          enum: [created, exists, skipped_past, failed]
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Present for created and exists.
        revision:
          type: integer
          minimum: 1
          description: Present for created (always 1) and exists (the current revision, never changed by a fill).
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          description: Present only for failed.
          properties:
            code:
              type: string
              enum: [generation_failed, rule_violation, week_not_editable, invalid_week]
            message:
              type: string
    MonthFillResult:
      type: object
      additionalProperties: false
      required: [month, weeks]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        weeks:
          type: array
          minItems: 4
          maxItems: 6
          description: Every Monday-Sunday week overlapping the month, in order.
          items:
            $ref: '#/components/schemas/WeekFillOutcome'
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [week_start]
      properties:
        week_start:
          type: string
          format: date
          description: Monday of the household week to create.
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to 42.
    ProposeRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Solver seed; defaults to the current plan seed + 1.
    ExpectedRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
    SlotChange:
      type: object
      additionalProperties: false
      required: [assignment_id, date, meal, kind, before, after]
      properties:
        assignment_id:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        meal:
          type: string
          enum: [lunch, dinner]
        kind:
          type: string
          enum: [changed, added, removed]
        before:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
        after:
          oneOf:
            - $ref: '#/components/schemas/MealAssignment'
            - type: 'null'
    Proposal:
      type: object
      additionalProperties: false
      required: [proposal_id, plan_id, base_revision, base_snapshot_id, seed, created_at, expires_at, identical, changes, plan, shopping_list]
      properties:
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        base_revision:
          type: integer
          minimum: 1
          description: The current revision this proposal was computed against.
        base_snapshot_id:
          type: string
          minLength: 1
        seed:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        identical:
          type: boolean
          description: True when accepting would change nothing; plan is then the current content.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SlotChange'
        plan:
          $ref: '#/components/schemas/Plan'
        shopping_list:
          $ref: '#/components/schemas/ShoppingList'
    MutationResult:
      type: object
      additionalProperties: false
      required: [plan_id, revision, snapshot_id, changed, replayed]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        revision:
          type: integer
          minimum: 1
          description: The current revision after the call (unchanged when changed is false).
        snapshot_id:
          type: string
          minLength: 1
        changed:
          type: boolean
        replayed:
          type: boolean
          description: True when this is a replay of an earlier request with the same Idempotency-Key.
    RevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, snapshot_id, source, created_at]
      properties:
        revision:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 1
        source:
          type: string
          enum: [import, create, regenerate, undo]
        created_at:
          type: string
          format: date-time
    RevisionList:
      type: object
      additionalProperties: false
      required: [plan_id, items]
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        items:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/RevisionSummary'
    CoverageState:
      type: string
      enum: [not_covered, on_list, covered]
      description: not_covered (no trip), on_list (open trip), covered (done trip).
    ShoppingTripWeek:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, revision, snapshot_id, current_revision, coverage, changed_since_shopping]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        revision:
          type: integer
          minimum: 1
          description: The plan revision this trip's items use for the week; the current revision on an open trip, the covered revision on a done trip.
        snapshot_id:
          type: string
          minLength: 1
          description: snapshot_id of that revision.
        current_revision:
          type: integer
          minimum: 1
          description: The plan's current revision when the trip was read.
        coverage:
          type: string
          enum: [on_list, covered]
          description: on_list for an open trip, covered for a done trip.
        changed_since_shopping:
          type: boolean
          description: True on a done trip when current_revision is newer than revision.
    ShoppingTripItem:
      type: object
      additionalProperties: false
      required: [ingredient_id, display, quantity, unit, section, plan_ids]
      properties:
        ingredient_id:
          type: string
          minLength: 1
        display:
          type: string
        quantity:
          type: number
          minimum: 0
          description: Sum over the contributing weeks for this ingredient and unit.
        unit:
          type: string
          enum: [g, ml, units]
        section:
          type: string
        plan_ids:
          type: array
          description: Plans whose grocery rows contribute to this item, in week order.
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
    ShoppingTrip:
      type: object
      additionalProperties: false
      required: [trip_id, name, status, version, created_at, updated_at, completed_at, weeks, items]
      description: A shopping trip (called a shopping list in the UI) with its weeks and derived items. Reused by the static publication.
      properties:
        trip_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [open, done]
        version:
          type: integer
          minimum: 1
          description: Starts at 1 and increases by 1 on every mutation; the optimistic-concurrency token.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
          description: When the trip was marked done; null while open.
        weeks:
          type: array
          minItems: 1
          description: Covered weeks, ordered by week_start.
          items:
            $ref: '#/components/schemas/ShoppingTripWeek'
        items:
          type: array
          description: Derived sum of the weeks' saved grocery rows per ingredient and unit, grouped by section.
          items:
            $ref: '#/components/schemas/ShoppingTripItem'
    ShoppingTripList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingTrip'
    CreateShoppingTripRequest:
      type: object
      additionalProperties: false
      required: [plan_ids]
      properties:
        plan_ids:
          type: array
          minItems: 1
          maxItems: 60
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        name:
          type: [string, 'null']
          maxLength: 80
          description: Optional short label; defaults to the covered date range.
    AddTripWeekRequest:
      type: object
      additionalProperties: false
      required: [plan_id, expected_version]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
    WeekCoverage:
      type: object
      additionalProperties: false
      required: [plan_id, week_start, week_end, coverage, trip_id, changed_since_shopping]
      properties:
        plan_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        coverage:
          $ref: '#/components/schemas/CoverageState'
        trip_id:
          anyOf:
            - {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
            - type: 'null'
        changed_since_shopping:
          type: boolean
    CoverageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeekCoverage'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_week, forbidden, read_only, plan_not_found, snapshot_changed, source_unavailable, source_invalid, stale_revision, proposal_not_found, proposal_expired, input_basis_changed, retry_id_reused, nothing_to_undo, linked_pair_split, week_not_editable, duplicate_week, generation_failed, rule_violation, generation_busy, trip_not_found, stale_version, week_already_on_trip, trip_done, trip_not_done, week_not_on_trip, last_week]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
